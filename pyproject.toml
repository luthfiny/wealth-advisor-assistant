[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wealth-advisor-assistant"
version = "0.1.0"
description = "An auditable multi-agent wealth advisor simulation with local tools and human review"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
wealth-advisor = "wealth_advisor.cli:main"

[tool.setuptools.packages.find]
include = ["wealth_advisor*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
