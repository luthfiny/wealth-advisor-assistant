[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wealth-advisor-assistant"
version = "0.2.0"
description = "An auditable multi-agent wealth advisor simulation with local tools and human review"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-PolyForm-Free-Trial-1.0.0"
license-files = ["LICENSE", "COPYRIGHT"]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp==2.3.0"]

[project.scripts]
wealth-advisor = "wealth_advisor.cli:main"
wealth-advisor-mcp = "wealth_advisor.mcp_server:main"

[tool.setuptools.packages.find]
include = ["wealth_advisor*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
